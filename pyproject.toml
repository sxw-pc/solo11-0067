[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaharvest"
version = "0.1.0"
description = "Local, offline OAI-PMH metadata harvesting workbench with an embedded mock repository."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MetaHarvest Demo" }]
dependencies = [
  "Flask>=3.0,<4",
  "Werkzeug>=3.0,<4",
  "requests>=2.31,<3",
  "PyYAML>=6.0,<7",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
metaharvest = "metaharvest.cli:main_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
